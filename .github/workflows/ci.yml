name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The server typechecks against the GENERATED Prisma client (dev machines
      # have it from `prisma migrate`; a fresh runner does not) — without this
      # every Prisma type is `any` and typecheck fails before anything runs
      # (the prisma CLI is a server devDependency, not hoisted — run it in that workspace)
      - run: npm exec -w apps/server -- prisma generate
      # Shared must be built first — web and server typecheck against its dist
      - run: npm run build -w packages/shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # S10: what we ship must be permissively licensed and free of unaccepted
      # high/critical advisories (scripts/audit.mjs carries the written allowlist)
      - run: node scripts/licenses.mjs --check
      - run: node scripts/audit.mjs
